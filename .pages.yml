# Pages CMS configuration for dbuscaldi.github.io (al-folio theme)
# Docs: https://pagescms.org/docs/configuration/

media:
  input: assets/img
  output: /assets/img

content:
  # ---------------------------------------------------------------------------
  # Home page
  # ---------------------------------------------------------------------------
  - name: profile
    label: Profile (home page)
    type: file
    path: _pages/about.md
    format: yaml-frontmatter
    fields:
      - { name: layout, type: string, hidden: true, default: about }
      - { name: title, type: string, hidden: true, default: profile }
      - { name: permalink, type: string, hidden: true, default: / }
      - name: subtitle
        label: Subtitle (position line under your name)
        type: string
        description: HTML links are allowed, e.g. <a href="https://...">Université Sorbonne Paris Nord</a>
      - name: profile
        label: Photo and address
        type: object
        fields:
          - name: align
            type: select
            options: { values: [right, left] }
            default: right
          - name: image
            label: Photo file name in assets/img (e.g. prof_pic.jpg)
            type: string
          - { name: image_circular, label: Circular photo, type: boolean, default: false }
          - name: more_info
            label: Address block (HTML)
            type: text
      - { name: selected_papers, label: Show selected publications, type: boolean, default: true }
      - { name: social, label: Show social icons, type: boolean, default: true }
      - name: announcements
        label: News on home page
        type: object
        fields:
          - { name: enabled, type: boolean, default: false }
          - { name: scrollable, type: boolean, default: true }
          - { name: limit, label: Number of items, type: number, default: 5 }
      - name: latest_posts
        type: object
        hidden: true
        fields:
          - { name: enabled, type: boolean, default: false }
      - name: body
        label: Biography
        type: rich-text

  # ---------------------------------------------------------------------------
  # Simple pages (projects, events, downloads, contact, misc)
  # ---------------------------------------------------------------------------
  - name: pages
    label: Pages
    type: collection
    path: _pages
    format: yaml-frontmatter
    exclude:
      - about.md
      - publications.md
      - news.md
      - 404.md
      - menu-research.md
      - menu-downloads.md
    view:
      fields: [title, permalink]
      primary: title
      sort: permalink
    fields:
      - { name: layout, type: string, hidden: true, default: page }
      - { name: title, label: Title (shown in menu and page header), type: string, required: true }
      - name: permalink
        label: Web address
        type: string
        required: true
        description: Must start and end with a slash, e.g. /research/projects/
      - name: description
        label: Short description under the title
        type: string
      - name: nav
        label: Show in top menu
        type: boolean
        default: false
        description: Leave off for pages already listed in the Research or Downloads menus
      - { name: nav_order, label: Menu position, type: number }
      - { name: body, label: Content, type: rich-text }

  # ---------------------------------------------------------------------------
  # News items (shown on /news/ and optionally on the home page)
  # ---------------------------------------------------------------------------
  - name: news
    label: News
    type: collection
    path: _news
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [date, title]
      primary: title
      sort: date
      order: desc
    fields:
      - { name: layout, type: string, hidden: true, default: post }
      - { name: date, type: date, required: true }
      - name: inline
        label: Short item (no separate page)
        type: boolean
        default: true
      - name: title
        label: Title (used only for long items)
        type: string
      - { name: related_posts, type: boolean, hidden: true, default: false }
      - { name: body, label: Text, type: rich-text }

  # ---------------------------------------------------------------------------
  # Publications: the BibTeX file, edited as plain text
  # ---------------------------------------------------------------------------
  - name: publications
    label: Publications (BibTeX)
    type: file
    path: _bibliography/papers.bib
    format: code

  # ---------------------------------------------------------------------------
  # Social links on the profile page
  # ---------------------------------------------------------------------------
  - name: socials
    label: Social links
    type: file
    path: _data/socials.yml
    format: yaml
    fields:
      - { name: email, type: string }
      - { name: scholar_userid, label: Google Scholar ID, type: string }
      - { name: orcid_id, label: ORCID, type: string }
      - { name: dblp_url, label: DBLP URL, type: string }
      - { name: github_username, label: GitHub username, type: string }
      - { name: linkedin_username, label: LinkedIn username, type: string }
      - { name: researchgate_profile, label: ResearchGate profile, type: string }
      - { name: semanticscholar_id, label: Semantic Scholar ID, type: string }
